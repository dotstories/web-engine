<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block check · DotStories Web Engine</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.5rem 0; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ccc; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; font-size: 13px; }
      button { font: inherit; padding: 0.4rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Does one Krea 2 block match the reference?</h1>
      <p>Runs one transformer block of your Krea 2 file in the browser and compares it with the output of the official
        implementation (<code>tools/reference/block.py</code>). Loads about 0.5 GB onto the GPU.</p>
      <label>Model file <input id="model" type="file" accept=".safetensors" /></label>
      <label>Reference file <input id="reference" type="file" accept=".safetensors" /></label>
      <button id="run" type="button">Run block</button>
      <p id="status" role="status"></p>
      <table id="results" hidden><tbody></tbody></table>
      <div id="report" hidden>
        <h2>Report</h2>
        <button id="copy" type="button">Copy report</button>
        <pre></pre>
      </div>
      <p><small id="build"></small></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
