<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probe · DotStories Web Engine</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ccc; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; font-size: 13px; }
      button { font: inherit; padding: 0.4rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can this computer run Krea 2 in the browser?</h1>
      <p>Measures your GPU and browser storage. Takes about a minute. It writes a 1 GB test file and deletes it.</p>
      <p>Use Chrome or Edge on a desktop. If the browser asks to store data on this device, allow it.</p>
      <button id="run" type="button">Run probe</button>
      <p id="status" role="status"></p>
      <table id="gates" hidden>
        <thead><tr><th>Check</th><th>Needs</th><th>This computer</th><th>Result</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="report" hidden>
        <h2>Report</h2>
        <button id="copy" type="button">Copy report</button>
        <pre></pre>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
