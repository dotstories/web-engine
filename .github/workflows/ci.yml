name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No plans, private notes or session links in the public repo.
  private:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PRs: check every commit since the base
          persist-credentials: false
      - run: node scripts/check-private.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # PRs may change dependencies: refresh the lockfile and commit it back.
  # Runs no package code (--ignore-scripts): the write token never sits next to untrusted code.
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/ci.sh pnpm install --lockfile-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml pnpm-workspace.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "chore: update pnpm lockfile"
            git push
          fi

  # Builds and tests with a read-only token, no stored credentials, exactly the lockfile.
  test:
    needs: lockfile
    if: ${{ !cancelled() && needs.lockfile.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.sha }} # PRs: includes the lockfile update
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: scripts/ci.sh pnpm install --frozen-lockfile
      - run: scripts/ci.sh pnpm lint
      - run: scripts/ci.sh pnpm typecheck
      - run: scripts/ci.sh pnpm test
      - run: scripts/ci.sh pnpm build
      - run: scripts/ci.sh pnpm exec playwright install --with-deps chromium
      - run: scripts/ci.sh pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
