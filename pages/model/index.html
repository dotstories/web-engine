<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open model file · DotStories Web Engine</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ccc; vertical-align: top; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; font-size: 13px; max-height: 24rem; }
      button { font: inherit; padding: 0.4rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Open a model file</h1>
      <p>Pick <code>krea2_turbo_fp8_scaled.safetensors</code> (from your ComfyUI <code>models/diffusion_models</code> folder).
        Only the header and a few bytes are read. Nothing is uploaded.</p>
      <label>Model file <input id="file" type="file" accept=".safetensors" /></label>
      <p id="status" role="status"></p>
      <table id="summary" hidden><tbody></tbody></table>
      <div id="report" hidden>
        <h2>Report</h2>
        <button id="copy" type="button">Copy report</button>
        <pre></pre>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
